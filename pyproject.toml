[project]
name = "payment-module"
dynamic = ["version"]
description = "Reusable, self-hosted payment module: multi-merchant bank-transfer payments with SePay as the first provider."
readme = "readme.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.13"]
postgres = ["asyncpg>=0.29"]
fastapi = ["fastapi>=0.115"]
sepay = ["httpx>=0.28"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-timeout>=2.3",
    "ruff>=0.14",
    "testcontainers[postgres]>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/payment_module/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/payment_module", "tests", "readme.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
    "integration: needs PostgreSQL (docker/testcontainers)",
    "acceptance: end-to-end acceptance cases on PostgreSQL",
    "contract: provider payload contract tests",
]
